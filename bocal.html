<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🫙 Le Bocal de Laëtitia ❤️</title>
<style>

/* ===== RESET & BASE ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --rose:         #ff4f81;
  --rose-light:   #ff8fb1;
  --rose-pale:    #ffe0eb;
  --cream:        #fff8f0;
  --text-dark:    #4a1a2a;
  --glass:        rgba(255,255,255,0.18);
  --glass-border: rgba(255,255,255,0.35);
}

html { scroll-behavior: smooth; }

body {
  font-family: Georgia, serif;
  color: white;
  overflow-x: hidden;
  min-height: 100vh;
  background: linear-gradient(135deg, #c0285a 0%, #ff4f81 45%, #ff8fb1 100%);
}

/* ===== PÉTALES ===== */
#petals {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 0; overflow: hidden;
}
.petal {
  position: absolute; top: -40px; font-size: 1.4rem;
  animation: petalFall linear infinite; opacity: 0.75; user-select: none;
}
@keyframes petalFall {
  0%   { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0.8; }
  50%  { transform: translateY(50vh) rotate(180deg) translateX(30px); }
  100% { transform: translateY(110vh) rotate(360deg) translateX(-20px); opacity: 0; }
}

/* ===== CONFETTIS ===== */
.confetti-piece {
  position: fixed; top: -20px; border-radius: 2px;
  animation: confettiFall linear forwards; pointer-events: none; z-index: 8500;
}
@keyframes confettiFall {
  0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}

/* ===== ANIMATIONS GLOBALES ===== */
@keyframes float {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-12px); }
}
@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes popIn {
  0%   { transform: scale(0.5) rotate(-8deg); opacity: 0; }
  70%  { transform: scale(1.08) rotate(2deg); opacity: 1; }
  100% { transform: scale(1) rotate(0deg); opacity: 1; }
}
@keyframes shimmer {
  0%   { background-position: -200% center; }
  100% { background-position: 200% center; }
}
@keyframes pulse {
  0%,100% { transform: scale(1); }
  50%      { transform: scale(1.06); }
}

/* ===== ÉCRAN INTRO (bocal) ===== */
#intro {
  position: relative; min-height: 100vh; z-index: 1;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  text-align: center; gap: 24px; padding: 40px 20px;
}

#intro h1 {
  font-size: 2rem; font-weight: normal; letter-spacing: 0.03em;
  text-shadow: 0 2px 16px rgba(0,0,0,0.25);
  animation: fadeSlideIn 1s ease both;
}

#intro p.sub {
  font-size: 1.05rem; opacity: 0.82; font-style: italic; max-width: 360px;
  animation: fadeSlideIn 1s ease 0.2s both;
}

/* Le bocal animé */
#jar-wrap {
  animation: float 4s ease-in-out infinite, fadeSlideIn 1s ease 0.1s both;
  cursor: pointer; filter: drop-shadow(0 16px 40px rgba(0,0,0,0.3));
  transition: filter 0.3s;
}
#jar-wrap:hover { filter: drop-shadow(0 22px 50px rgba(0,0,0,0.45)); }

#jar-svg { width: 160px; height: 200px; }

/* Papiers dans le bocal */
.paper-in-jar {
  animation: float linear infinite;
}

#intro-btn {
  padding: 16px 36px; font-size: 1.1rem; border-radius: 50px;
  background: rgba(255,255,255,0.22); backdrop-filter: blur(12px);
  border: 1px solid var(--glass-border); color: white;
  font-family: Georgia, serif; cursor: pointer;
  transition: background 0.2s, transform 0.15s;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  animation: fadeSlideIn 1s ease 0.4s both;
}
#intro-btn:hover {
  background: rgba(255,255,255,0.38);
  transform: translateY(-2px);
}

/* ===== ÉCRAN PRINCIPAL ===== */
#main {
  display: none; position: relative; z-index: 1;
  padding: 40px 20px 80px; max-width: 700px; margin: auto;
}

#main-header {
  text-align: center; margin-bottom: 36px;
  animation: fadeSlideIn 0.8s ease both;
}
#main-header h2 { font-size: 1.7rem; font-weight: normal; margin-bottom: 6px; }
#main-header .progress-label {
  font-size: 0.9rem; opacity: 0.7; font-style: italic; margin-bottom: 14px;
}
.progress-bar-wrap {
  width: 100%; max-width: 320px; height: 6px;
  background: rgba(255,255,255,0.2); border-radius: 3px; margin: 0 auto;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%; border-radius: 3px;
  background: white; transition: width 0.6s ease;
}

/* ===== ZONE CARTE ===== */
#card-zone {
  position: relative; width: 100%; min-height: 380px;
  display: flex; justify-content: center; align-items: center;
  perspective: 1000px;
}

/* Carte verrouillée (jours futurs) */
.card-locked {
  width: 280px; height: 340px; border-radius: 24px;
  background: rgba(255,255,255,0.1); backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.2);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; text-align: center; padding: 30px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
}
.card-locked .lock-icon { font-size: 3rem; opacity: 0.6; }
.card-locked p { font-size: 0.95rem; opacity: 0.6; font-style: italic; }

/* Carte révélée */
.card-revealed {
  width: 300px;
  animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
  cursor: grab; position: relative;
  transform-style: preserve-3d;
}
.card-revealed:active { cursor: grabbing; }

.card-inner {
  width: 100%; border-radius: 24px;
  background: var(--cream); color: var(--text-dark);
  padding: 36px 32px; text-align: center;
  box-shadow: 0 12px 40px rgba(0,0,0,0.25), 0 2px 0 #e8c8d5, 0 4px 0 #e0b8c8;
  position: relative; overflow: hidden;
}

/* Filigrane cœur en fond */
.card-inner::before {
  content: "❤️";
  position: absolute; bottom: -10px; right: -10px;
  font-size: 7rem; opacity: 0.05;
  transform: rotate(-15deg);
  pointer-events: none;
}

.card-number {
  font-size: 0.75rem; letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--rose); margin-bottom: 20px; opacity: 0.8;
}

.card-emoji { font-size: 2.8rem; margin-bottom: 16px; display: block; }

.card-text {
  font-size: 1.15rem; line-height: 1.75; color: var(--text-dark);
  font-style: italic;
}

.card-date {
  margin-top: 20px; font-size: 0.8rem; color: var(--rose);
  opacity: 0.7; font-style: normal; letter-spacing: 0.05em;
}

/* Ruban décoratif */
.card-ribbon {
  position: absolute; top: 14px; right: -8px;
  background: var(--rose); color: white;
  font-size: 0.7rem; padding: 4px 14px 4px 10px;
  border-radius: 3px 0 0 3px; letter-spacing: 0.08em;
}
.card-ribbon::after {
  content: ""; position: absolute; right: -8px; top: 0;
  border: 14px solid transparent; border-left-color: var(--rose);
  border-right: none;
}

/* ===== NAVIGATION ENTRE CARTES ===== */
#nav-row {
  display: flex; justify-content: center; align-items: center;
  gap: 16px; margin-top: 28px;
}

.nav-btn {
  width: 48px; height: 48px; border-radius: 50%;
  background: rgba(255,255,255,0.2); backdrop-filter: blur(8px);
  border: 1px solid var(--glass-border); color: white;
  font-size: 1.4rem; cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  transition: background 0.2s, transform 0.15s;
}
.nav-btn:hover:not(:disabled) { background: rgba(255,255,255,0.38); transform: scale(1.08); }
.nav-btn:disabled { opacity: 0.3; cursor: default; }

#nav-counter {
  font-size: 0.9rem; opacity: 0.75; min-width: 60px; text-align: center;
}

/* ===== DOTS NAVIGATION ===== */
#dots-row {
  display: flex; justify-content: center; flex-wrap: wrap;
  gap: 7px; margin-top: 24px; max-width: 400px; margin-left: auto; margin-right: auto;
}

.rdot {
  width: 10px; height: 10px; border-radius: 50%; cursor: pointer;
  transition: transform 0.2s, opacity 0.2s;
  border: 1px solid rgba(255,255,255,0.5);
}
.rdot.unlocked  { background: white; opacity: 0.9; }
.rdot.current   { background: white; transform: scale(1.4); opacity: 1; box-shadow: 0 0 0 2px rgba(255,255,255,0.4); }
.rdot.locked    { background: rgba(255,255,255,0.2); opacity: 0.4; cursor: default; }

/* ===== SWIPE HINT ===== */
#swipe-hint {
  text-align: center; margin-top: 16px;
  font-size: 0.85rem; opacity: 0.55; font-style: italic;
  animation: pulse 2s ease-in-out infinite;
}

/* ===== TOAST ===== */
#toast {
  position: fixed; bottom: 80px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(180,0,60,0.92); backdrop-filter: blur(12px);
  color: white; padding: 14px 28px; border-radius: 50px; font-size: 1rem;
  opacity: 0; transition: opacity 0.3s, transform 0.3s;
  z-index: 8000; pointer-events: none; white-space: nowrap;
  border: 1px solid rgba(255,255,255,0.25);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ===== RESPONSIVE ===== */
@media (max-width: 400px) {
  .card-revealed { width: 270px; }
  .card-inner { padding: 28px 22px; }
  .card-text { font-size: 1.05rem; }
}

@media (prefers-reduced-motion: reduce) {
  .petal, .confetti-piece { animation: none; }
  * { transition-duration: 0.01ms !important; }
}


/* ===== ÉCRAN MOT DE PASSE ===== */
#mdp-screen {
  position: fixed; inset: 0; z-index: 999;
  display: flex; justify-content: center; align-items: center;
  background: linear-gradient(135deg, #c0285a 0%, #ff4f81 45%, #ff8fb1 100%);
  padding: 20px;
}
.mdp-card {
  background: var(--cream); color: var(--text-dark);
  border-radius: 28px; padding: 50px 40px; text-align: center;
  max-width: 360px; width: 100%;
  box-shadow: 0 16px 56px rgba(0,0,0,0.35), 0 2px 0 #e8c8d5, 0 4px 0 #e0b8c8;
  animation: fadeSlideIn 0.8s ease both;
}
.mdp-card .jar-big { font-size: 4rem; margin-bottom: 16px; display: block; }
.mdp-card h2 { font-size: 1.4rem; font-weight: normal; color: var(--rose); margin-bottom: 8px; }
.mdp-card .hint { font-size: 0.9rem; opacity: 0.65; font-style: italic; margin-bottom: 28px; line-height: 1.6; }
.mdp-card input {
  width: 100%; padding: 14px 18px; border-radius: 50px;
  border: 1.5px solid rgba(255,100,150,0.3); font-size: 1.1rem;
  font-family: Georgia, serif; text-align: center;
  background: #fff8f0; color: var(--text-dark); outline: none;
  letter-spacing: 0.12em; transition: border-color 0.2s, box-shadow 0.2s;
}
.mdp-card input:focus {
  border-color: var(--rose);
  box-shadow: 0 0 0 3px rgba(255,79,129,0.2);
}
.mdp-card .mdp-ok-btn {
  margin-top: 16px; width: 100%; padding: 14px; border-radius: 50px;
  border: none; background: var(--rose); color: white;
  font-family: Georgia, serif; font-size: 1.05rem; cursor: pointer;
  transition: background 0.2s, transform 0.15s;
  box-shadow: 0 4px 20px rgba(255,79,129,0.35);
}
.mdp-card .mdp-ok-btn:hover { background: #d63060; transform: translateY(-1px); }
.mdp-card .mdp-err {
  display: none; margin-top: 14px; font-size: 0.9rem; color: var(--rose);
  animation: fadeSlideIn 0.4s ease both;
}
</style>
</head>
<body>

<!-- ÉCRAN MOT DE PASSE -->
<div id="mdp-screen">
  <div class="mdp-card">
    <span class="jar-big">🫙</span>
    <h2>Le Bocal de Laëtitia</h2>
    <p class="hint">Entre le mot de passe<br>que tu as trouvé près du lit ❤️</p>
    <input id="bocal-mdp" type="text" placeholder="Mot de passe…"
           autocomplete="off" autocorrect="off" spellcheck="false"
           onkeydown="if(event.key==='Enter') verifierMdpBocal()">
    <button class="mdp-ok-btn" onclick="verifierMdpBocal()">Ouvrir le bocal ✨</button>
    <div class="mdp-err" id="bocal-err">Essaie encore, pense au mot 💕</div>
  </div>
</div>

<div id="petals"></div>
<div id="toast"></div>

<!-- ===== ÉCRAN INTRO ===== -->
<div id="intro">
  <h1>🫙 Le Bocal de Laëtitia</h1>
  <p class="sub">17 raisons de t'aimer, une nouvelle chaque jour ❤️</p>

  <!-- Bocal SVG animé -->
  <div id="jar-wrap" onclick="ouvrirBocal()">
    <svg id="jar-svg" viewBox="0 0 160 200" xmlns="http://www.w3.org/2000/svg">
      <!-- Couvercle -->
      <rect x="42" y="18" width="76" height="20" rx="6" fill="#ffd6e7" opacity="0.9"/>
      <rect x="38" y="32" width="84" height="10" rx="4" fill="#ffb3cc" opacity="0.9"/>

      <!-- Corps bocal -->
      <path d="M38 42 Q30 50 28 80 L28 168 Q28 180 40 182 L120 182 Q132 180 132 168 L132 80 Q130 50 122 42 Z"
            fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.55)" stroke-width="2"/>

      <!-- Reflet gauche -->
      <path d="M38 55 Q33 80 33 120" stroke="rgba(255,255,255,0.4)" stroke-width="3" fill="none" stroke-linecap="round"/>

      <!-- Petits papiers à l'intérieur -->
      <g class="paper-in-jar" style="animation-duration:3s;animation-delay:0s">
        <rect x="52" y="110" width="22" height="16" rx="3" fill="#ff4f81" opacity="0.85" transform="rotate(-12 63 118)"/>
      </g>
      <g class="paper-in-jar" style="animation-duration:4s;animation-delay:-1s">
        <rect x="72" y="125" width="20" height="14" rx="3" fill="#fbbf24" opacity="0.85" transform="rotate(8 82 132)"/>
      </g>
      <g class="paper-in-jar" style="animation-duration:3.5s;animation-delay:-2s">
        <rect x="90" y="108" width="18" height="14" rx="3" fill="#a78bfa" opacity="0.85" transform="rotate(-5 99 115)"/>
      </g>
      <g class="paper-in-jar" style="animation-duration:4.5s;animation-delay:-0.5s">
        <rect x="55" y="140" width="20" height="14" rx="3" fill="#2dd4bf" opacity="0.85" transform="rotate(10 65 147)"/>
      </g>
      <g class="paper-in-jar" style="animation-duration:3.8s;animation-delay:-1.5s">
        <rect x="83" y="145" width="18" height="12" rx="3" fill="#fb923c" opacity="0.85" transform="rotate(-8 92 151)"/>
      </g>

      <!-- Cœurs flottants -->
      <text x="65" y="98" font-size="12" opacity="0.7" fill="#ff4f81">❤</text>
      <text x="95" y="102" font-size="9" opacity="0.5" fill="#ffb3cc">❤</text>
      <text x="78" y="160" font-size="10" opacity="0.6" fill="#ff4f81">❤</text>

      <!-- Brillance bocal -->
      <ellipse cx="80" cy="170" rx="36" ry="6" fill="rgba(255,255,255,0.08)"/>
    </svg>
  </div>

  <button id="intro-btn" onclick="ouvrirBocal()">Ouvrir le bocal ✨</button>
</div>

<!-- ===== ÉCRAN PRINCIPAL ===== -->
<div id="main">

  <div id="main-header">
    <h2>🫙 Mes raisons de t'aimer</h2>
    <p class="progress-label" id="progress-label"></p>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
  </div>

  <div id="card-zone"></div>

  <div id="swipe-hint">← glisse ou utilise les flèches →</div>

  <div id="nav-row">
    <button class="nav-btn" id="btn-prev" onclick="allerCarte(currentIdx-1)">‹</button>
    <span id="nav-counter"></span>
    <button class="nav-btn" id="btn-next" onclick="allerCarte(currentIdx+1)">›</button>
  </div>

  <div id="dots-row"></div>

</div>

<script>
/* ==========================================================
   LES 17 RAISONS — À personnaliser !
========================================================== */
const RAISONS = [
  { emoji: "🐱", texte: "Parce que tu es mon Chaton et que ce mot ne s'appliquera jamais à personne d'autre." },
  { emoji: "🍑", texte: "Parce que tu es la plus belle, ma bombshell, et tu ne le réalises même pas." },
  { emoji: "🌙", texte: "Parce que même les nuits difficiles sont plus douces quand tu es là (période de stress)." },
  { emoji: "🧠", texte: "Parce que tu es ma Smart girl, et que ça me rend plus intelligent rien qu'à t'écouter." },
  { emoji: "💪", texte: "Parce que tu es plus forte que tu ne le crois, et que je le vois même quand toi tu ne le vois pas." },
  { emoji: "🚗", texte: "Parce que t'es ma monitrice préférée." },
  { emoji: "🎵", texte: "Parce que tu danses n'importe où, n'importe quand, et que ça rend la vie meilleure." },
  { emoji: "🫂", texte: "Parce que je raffolle de tes câlins." },
  { emoji: "🫶", texte: "Parce qu'on se soutient l'un l'autre. On est une équipe (t'as la ref?)" },
  { emoji: "🔥", texte: "Parce que tu te bats pour ce qui compte pour toi." },
  { emoji: "🍕", texte: "Parce que même les simples soirées canapé/table à regarder une série/film avec toi sont mes meilleurs souvenirs." },
  { emoji: "🌈", texte: "Parce que tu me fais plaisir à t'intéresser à ce que j'aime." },
  { emoji: "😂", texte: "Parce que tu me fais rire comme personne, même dans les moments les plus cons." },
  { emoji: "🌊", texte: "Parce que tu n'abandonnes pas." },
  { emoji: "✨", texte: "Parce que tu rends les choses ordinaires un peu magiques, sans t'en rendre compte." },
  { emoji: "🏡", texte: "Parce qu'en vivant tous les 2, j'ai compris ce que ça veut dire : se sentir à la maison." },
  { emoji: "❤️", texte: "Parce que trois ans plus tard, je suis encore plus sûr que le 17 juin 2023 a été le meilleur jour de ma vie." },
];

/* Date de début — chaque raison se déverrouille 1 jour après la précédente */
const DATE_DEBUT = new Date("2026-06-17"); // ← J1 = 17 juin 2026, +1 raison par jour

/* ==========================================================
   UTILITAIRES
========================================================== */
function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),3000);
}

function lancerConfettis(){
  const colors=["#ff4f81","#ffb3cc","#fff","#ffd700","#ff8fb1","#c0392b","#a78bfa"];
  for(let i=0;i<70;i++){
    const c=document.createElement("div"); c.className="confetti-piece";
    c.style.left=(Math.random()*100)+"vw";
    c.style.background=colors[Math.floor(Math.random()*colors.length)];
    c.style.width=(6+Math.random()*8)+"px"; c.style.height=(6+Math.random()*8)+"px";
    c.style.borderRadius=Math.random()>0.5?"50%":"2px";
    c.style.animationDuration=(1.5+Math.random()*2.5)+"s";
    c.style.animationDelay=(Math.random()*0.6)+"s";
    document.body.appendChild(c); setTimeout(()=>c.remove(),4000);
  }
}

/* Nombre de raisons déverrouillées selon la date */
function nbDebloquees(){
  const now = new Date();
  const diff = Math.floor((now - DATE_DEBUT) / 86400000);
  return Math.min(Math.max(diff + 1, 1), RAISONS.length); // au moins 1, max 17
}

function formatDate(joursDepuis){
  const d = new Date(DATE_DEBUT);
  d.setDate(d.getDate() + joursDepuis);
  return d.toLocaleDateString("fr-FR", { day:"numeric", month:"long" });
}

/* ==========================================================
   MOT DE PASSE BOCAL
========================================================== */
const BOCAL_MDP = "chaton"; // ← Même mot de passe que dans index.html !

function verifierMdpBocal(){
  const val=document.getElementById("bocal-mdp").value.toLowerCase().trim();
  if(val===BOCAL_MDP.toLowerCase()){
    const screen=document.getElementById("mdp-screen");
    screen.style.transition="opacity 0.6s ease";
    screen.style.opacity="0";
    setTimeout(()=>screen.remove(), 600);
  } else {
    const err=document.getElementById("bocal-err");
    err.style.display="block";
    document.getElementById("bocal-mdp").value="";
    document.getElementById("bocal-mdp").style.borderColor="#ff4f81";
    setTimeout(()=>{ document.getElementById("bocal-mdp").style.borderColor=""; },1500);
  }
}

// Si on arrive depuis index.html avec le bon paramètre, pas besoin de ressaisir
(function(){
  const params=new URLSearchParams(window.location.search);
  if(params.get("ok")==="1"){
    document.getElementById("mdp-screen").remove();
  }
})();

/* ==========================================================
   PÉTALES
========================================================== */
(function(){
  const ct=document.getElementById("petals");
  const em=["🌸","🌹","💕","✨","🌷","💖"];
  for(let i=0;i<20;i++){
    const p=document.createElement("div"); p.className="petal";
    p.textContent=em[Math.floor(Math.random()*em.length)];
    p.style.left=Math.random()*100+"vw";
    p.style.fontSize=(0.9+Math.random()*1.0)+"rem";
    p.style.animationDuration=(7+Math.random()*10)+"s";
    p.style.animationDelay=(-Math.random()*15)+"s";
    p.style.opacity=0.5+Math.random()*0.4;
    ct.appendChild(p);
  }
})();

/* ==========================================================
   NAVIGATION
========================================================== */
let currentIdx = 0;
let debloquees = 1;
let firstOpen = true;

function ouvrirBocal(){
  debloquees = nbDebloquees();
  document.getElementById("intro").style.display = "none";
  const main = document.getElementById("main");
  main.style.display = "block";
  main.style.opacity = "0";
  main.style.animation = "fadeSlideIn 0.8s ease both";
  requestAnimationFrame(()=>{ main.style.opacity="1"; });

  allerCarte(0); // ouvre toujours sur la raison n°1
  buildDots();
  updateProgress();
  if(firstOpen){ lancerConfettis(); firstOpen=false; }
}

function allerCarte(idx){
  debloquees = nbDebloquees();
  if(idx < 0) idx = 0;
  if(idx >= RAISONS.length) idx = RAISONS.length - 1;

  if(idx >= debloquees){
    showToast("Cette raison se déverrouille le " + formatDate(idx) + " 🔒");
    return;
  }

  const wasNew = (idx === debloquees - 1) && (currentIdx !== idx);
  currentIdx = idx;
  renderCarte(idx, wasNew);
  buildDots();
  updateProgress();
  updateNav();
}

function updateProgress(){
  const label = document.getElementById("progress-label");
  const fill  = document.getElementById("progress-fill");
  label.textContent = debloquees + " / " + RAISONS.length + " raisons découvertes";
  fill.style.width = (debloquees / RAISONS.length * 100) + "%";
}

function updateNav(){
  document.getElementById("btn-prev").disabled = (currentIdx <= 0);
  document.getElementById("btn-next").disabled = (currentIdx >= debloquees - 1);
  document.getElementById("nav-counter").textContent = (currentIdx+1) + " / " + debloquees;
}

/* ==========================================================
   RENDU DE LA CARTE
========================================================== */
function renderCarte(idx, isNew){
  const zone = document.getElementById("card-zone");
  const r = RAISONS[idx];
  const dateStr = formatDate(idx);

  zone.innerHTML = `
    <div class="card-revealed" id="active-card">
      <div class="card-inner">
        <div class="card-ribbon">Raison n°${idx+1}</div>
        <div class="card-number">— ${dateStr} —</div>
        <span class="card-emoji">${r.emoji}</span>
        <p class="card-text">${r.texte}</p>
      </div>
    </div>
  `;

  if(isNew) lancerConfettis();

  /* Swipe tactile */
  bindSwipe(document.getElementById("active-card"));
}

function renderLocked(){
  const zone = document.getElementById("card-zone");
  zone.innerHTML = `
    <div class="card-locked">
      <div class="lock-icon">🔒</div>
      <p>Cette raison n'est pas encore disponible.<br>Reviens demain ❤️</p>
    </div>
  `;
}

/* ==========================================================
   DOTS
========================================================== */
function buildDots(){
  const row = document.getElementById("dots-row");
  row.innerHTML = "";
  for(let i=0;i<RAISONS.length;i++){
    const d = document.createElement("div");
    let cls = "rdot ";
    if(i === currentIdx) cls += "current";
    else if(i < debloquees) cls += "unlocked";
    else cls += "locked";
    d.className = cls;
    d.title = i < debloquees ? "Raison n°"+(i+1) : "🔒 " + formatDate(i);
    if(i < debloquees) d.onclick = ()=>allerCarte(i);
    row.appendChild(d);
  }
}

/* ==========================================================
   SWIPE TACTILE
========================================================== */
function bindSwipe(el){
  if(!el) return;
  let startX=0, startY=0, dragging=false;
  const THRESHOLD = 50;

  el.addEventListener("touchstart", e=>{
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    dragging = true;
  },{passive:true});

  el.addEventListener("touchmove", e=>{
    if(!dragging) return;
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    if(Math.abs(dx) > Math.abs(dy)){
      e.preventDefault();
      el.style.transform = `translateX(${dx*0.3}px) rotate(${dx*0.02}deg)`;
      el.style.transition = "none";
    }
  },{passive:false});

  el.addEventListener("touchend", e=>{
    if(!dragging) return;
    dragging = false;
    const dx = e.changedTouches[0].clientX - startX;
    el.style.transition = "transform 0.3s ease";

    if(dx < -THRESHOLD){
      // Swipe gauche → carte suivante
      el.style.transform = "translateX(-120%) rotate(-10deg)";
      el.style.opacity   = "0";
      setTimeout(()=>allerCarte(currentIdx+1), 250);
    } else if(dx > THRESHOLD){
      // Swipe droite → carte précédente
      el.style.transform = "translateX(120%) rotate(10deg)";
      el.style.opacity   = "0";
      setTimeout(()=>allerCarte(currentIdx-1), 250);
    } else {
      el.style.transform = "";
    }
  },{passive:true});

  /* Drag souris */
  let mouseX=0, mouseDown=false;
  el.addEventListener("mousedown", e=>{ mouseX=e.clientX; mouseDown=true; el.style.transition="none"; });
  window.addEventListener("mousemove", e=>{
    if(!mouseDown) return;
    const dx=e.clientX-mouseX;
    el.style.transform=`translateX(${dx*0.25}px) rotate(${dx*0.015}deg)`;
  });
  window.addEventListener("mouseup", e=>{
    if(!mouseDown) return; mouseDown=false;
    const dx=e.clientX-mouseX;
    el.style.transition="transform 0.3s ease, opacity 0.3s ease";
    if(dx < -THRESHOLD){
      el.style.transform="translateX(-120%) rotate(-10deg)"; el.style.opacity="0";
      setTimeout(()=>allerCarte(currentIdx+1),250);
    } else if(dx > THRESHOLD){
      el.style.transform="translateX(120%) rotate(10deg)"; el.style.opacity="0";
      setTimeout(()=>allerCarte(currentIdx-1),250);
    } else { el.style.transform=""; }
  });
}

/* ==========================================================
   TOUCHES CLAVIER
========================================================== */
document.addEventListener("keydown", e=>{
  if(document.getElementById("main").style.display==="none") return;
  if(e.key==="ArrowLeft")  allerCarte(currentIdx-1);
  if(e.key==="ArrowRight") allerCarte(currentIdx+1);
});

</script>
</body>
