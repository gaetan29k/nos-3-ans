<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pour Laëtitia ❤️</title>

<style>

body{
    margin:0;
    font-family: Georgia, serif;
    color:white;
    background: linear-gradient(135deg, #ff4f81, #ff8fb1);
    overflow-x:hidden;
}

/* ENVELOPPE */
.screen{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
}

.envelope{
    width:220px;
    height:140px;
    position:relative;
    cursor:pointer;
    animation: float 3s ease-in-out infinite;
}

.envelope-base{
    position:absolute;
    width:100%;
    height:100%;
    background:#fff;
    border-radius:10px;
}

.envelope-flap{
    position:absolute;
    width:100%;
    height:100%;
    background:#ff4f81;
    clip-path: polygon(0 0, 50% 55%, 100% 0);
}

.envelope.open .envelope-flap{
    transform: rotateX(180deg);
}

/* CONTENU */
.content{
    display:none;
    padding:40px 20px;
    max-width:900px;
    margin:auto;
}

.letter{
    background:rgba(255,255,255,0.15);
    padding:25px;
    border-radius:20px;
    line-height:1.6;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
    margin-top:20px;
}

.gallery img{
    width:100%;
    height:250px;
    object-fit:cover;
    border-radius:15px;
}

/* BOUTON */
#gameBtn{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    padding:18px 28px;
    font-size:20px;
    border-radius:25px;
    background:rgba(255,255,255,0.3);
    cursor:pointer;
    display:none;
}

/* JEU */
#game{
    display:none;
    padding:40px 20px;
    text-align:center;
}

#puzzle{
    width:300px;
    height:300px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    gap:2px;
}

.tile{
    width:100%;
    height:100%;
    background-image:url("photo4.jpg"); /* 👈 TA PHOTO */
    background-size:300px 300px;
    cursor:pointer;
}

#puzzleMsg{
    display:none;
    margin-top:20px;
}

/* ANIM */
@keyframes float{
    0%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
    100%{transform:translateY(0)}
}

</style>
</head>

<body>

<!-- ENVELOPPE -->
<div class="screen" id="screen">

    <div class="envelope" onclick="ouvrir()">
        <div class="envelope-flap"></div>
        <div class="envelope-base"></div>
    </div>

    <p>Clique pour ouvrir ❤️</p>

</div>

<!-- CONTENU -->
<div class="content" id="content">

    <div class="letter">
        <h2>Mon Chaton ❤️</h2>
        <p>Depuis le 18 mai 2023, puis le 17 juin où tout a commencé officiellement...</p>
        <p>Tu es ma plus belle histoire ❤️</p>
        <p>— Doudou</p>
    </div>

    <div class="gallery">
        <img src="photo1.jpg">
        <img src="photo2.jpg">
        <img src="photo3.jpg">
        <img src="photo4.jpg">
    </div>

</div>

<!-- JEU -->
<div id="game">

    <h2>🧩 Puzzle</h2>

    <div id="puzzle"></div>

    <div id="puzzleMsg">
        🎉 Bravo ❤️ Tu as trouvé l’indice !
    </div>

</div>

<!-- BOUTON -->
<div id="gameBtn" onclick="ouvrirJeu()">🎁 Jeu de piste</div>

<script>

let selected=null;

/* OUVERTURE */
function ouvrir(){
    document.querySelector(".envelope").classList.add("open");

    setTimeout(()=>{
        document.getElementById("screen").style.display="none";
        document.getElementById("content").style.display="block";

        document.getElementById("gameBtn").style.display="block";

        lancerPuzzle(); // ⚠️ IMPORTANT
    },1000);
}

/* OUVRIR JEU */
function ouvrirJeu(){
    document.getElementById("content").style.display="none";
    document.getElementById("game").style.display="block";
}

/* PUZZLE ULTRA SIMPLE QUI MARCHE */
function lancerPuzzle(){

    const puzzle=document.getElementById("puzzle");
    puzzle.innerHTML="";

    let arr=[0,1,2,3,4,5,6,7,8];
    arr.sort(()=>Math.random()-0.5);

    arr.forEach((pos,i)=>{

        const tile=document.createElement("div");
        tile.className="tile";

        tile.style.backgroundPosition=
        `${(pos%3)*-100}px ${Math.floor(pos/3)*-100}px`;

        tile.dataset.correct=pos;

        tile.onclick=()=>select(tile);

        puzzle.appendChild(tile);
    });
}

/* SWAP SIMPLE */
function select(tile){

    if(!selected){
        selected=tile;
        tile.style.outline="2px solid white";
    } else {

        let tmp=tile.style.backgroundPosition;
        tile.style.backgroundPosition=selected.style.backgroundPosition;
        selected.style.backgroundPosition=tmp;

        selected.style.outline="";
        selected=null;

        checkWin();
    }
}

/* CHECK */
function checkWin(){

    const tiles=document.querySelectorAll(".tile");

    let ok=true;

    tiles.forEach((t,i)=>{
        if(t.dataset.correct!=i) ok=false;
    });

    if(ok){
        document.getElementById("puzzleMsg").style.display="block";
    }
}

</script>

</body>
</html>
