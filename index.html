<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pour Laëtitia ❤️</title>

<style>

body{
    margin:0;
    font-family: Georgia, serif;
    color:white;
    overflow-x:hidden;
    background: linear-gradient(135deg, #ff4f81, #ff8fb1);
}

/* ========== ENVELOPPE ========== */
.screen{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    position:relative;
}

.screen::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.12);
}

.screen > *{ position:relative; }

.envelope-container{ perspective:1000px; }

.envelope{
    width:220px;
    height:140px;
    position:relative;
    cursor:pointer;
    animation: float 3s ease-in-out infinite;
}

.envelope-base{
    position:absolute;
    width:100%;
    height:100%;
    background:#fff;
    border-radius:10px;
    box-shadow:0 15px 40px rgba(0,0,0,0.25);
}

.envelope-flap{
    position:absolute;
    width:100%;
    height:100%;
    background:#ff4f81;
    clip-path: polygon(0 0, 50% 55%, 100% 0);
    transform-origin: top;
    transition: transform 1s ease;
    border-radius:10px;
}

.envelope.open .envelope-flap{
    transform: rotateX(180deg);
}

/* texte */
.text-start{
    margin-top:25px;
    font-size:1.3rem;
}

/* ========== CONTENU ========== */
.content{
    display:none;
    padding:50px 20px;
    max-width:900px;
    margin:auto;
}

/* lettre */
.letter{
    background:rgba(255,255,255,0.18);
    padding:30px;
    border-radius:20px;
    backdrop-filter: blur(10px);
    line-height:1.8;
}

/* galerie */
.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
    margin-top:30px;
}

.gallery img{
    width:100%;
    height:250px;
    object-fit:cover;
    border-radius:15px;
    cursor:pointer;
}

/* bouton jeu */
#gameBtn{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    padding:18px 28px;
    font-size:22px;
    border-radius:25px;
    background:rgba(255,255,255,0.25);
    backdrop-filter: blur(10px);
    cursor:pointer;
    display:none;
}

/* ========== ZOOM IMAGE ========== */
.zoom-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.85);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:1000;
}

.zoom-overlay img{
    max-width:90%;
    max-height:90%;
}

/* ========== PUZZLE ========== */
#game{
    display:none;
    padding:60px 20px;
    text-align:center;
}

#puzzle{
    width:300px;
    height:300px;
    margin:20px auto;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    gap:2px;
}

.tile{
    width:100%;
    height:100%;
    background-image:url("photo1.jpg"); /* 👈 TON IMAGE */
    background-size:300px 300px;
    cursor:pointer;
}

/* animations */
@keyframes float{
    0%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
    100%{transform:translateY(0)}
}

.heart,.petal{
    position:fixed;
    top:-20px;
    animation: fall linear forwards;
}

@keyframes fall{
    to{ transform:translateY(110vh) rotate(360deg); }
}

</style>
</head>

<body>

<!-- ENVELOPPE -->
<div class="screen" id="screen">

    <div class="envelope-container">
        <div class="envelope" id="envelope" onclick="ouvrir()">
            <div class="envelope-flap"></div>
            <div class="envelope-base"></div>
        </div>
    </div>

    <div class="text-start">Pour mon Chaton ❤️<br>Clique pour ouvrir</div>

</div>

<!-- CONTENU -->
<div class="content" id="content">

    <div class="letter">
        <h2>Mon Chaton ❤️</h2>

        <p>Depuis le 18 mai 2023 puis le 17 juin, nous avançons ensemble.</p>
        <p>Merci d’être toi ❤️</p>
        <p>— Doudou</p>
    </div>

    <div class="gallery">
        <img src="photo1.jpg" onclick="zoomImage(this.src)">
        <img src="photo2.jpg" onclick="zoomImage(this.src)">
        <img src="photo3.jpg" onclick="zoomImage(this.src)">
        <img src="photo4.jpg" onclick="zoomImage(this.src)">
    </div>

</div>

<!-- JEU -->
<div id="game">

    <h2>🧩 Puzzle secret</h2>
    <p>Recompose l’image ❤️</p>

    <div id="puzzle"></div>

    <div id="puzzleMsg" style="display:none;">
        🎉 Bravo ❤️<br>
        Indice : regarde là où tu dors 🛏️
    </div>

</div>

<!-- BOUTON JEU -->
<div id="gameBtn" onclick="ouvrirJeu()">🎁 Jeu de piste</div>

<!-- ZOOM -->
<div class="zoom-overlay" id="zoom" onclick="closeZoom()">
    <img id="zoomImg">
</div>

<script>

function ouvrir(){
    document.getElementById("envelope").classList.add("open");

    setTimeout(()=>{
        document.getElementById("screen").style.display="none";
        document.getElementById("content").style.display="block";
        document.getElementById("gameBtn").style.display="block";
        lancerEffets();
        initPuzzle();
    },1000);
}

/* NAV */
function ouvrirJeu(){
    document.getElementById("content").style.display="none";
    document.getElementById("game").style.display="block";
}

/* ZOOM */
function zoomImage(src){
    document.getElementById("zoomImg").src = src;
    document.getElementById("zoom").style.display="flex";
}

function closeZoom(){
    document.getElementById("zoom").style.display="none";
}

/* PUZZLE */
let order = [];
let selected = null;

function initPuzzle(){
    const puzzle = document.getElementById("puzzle");
    puzzle.innerHTML="";
    order=[];

    for(let i=0;i<9;i++) order.push(i);

    order.sort(()=>Math.random()-0.5);

    order.forEach((pos,i)=>{
        const tile=document.createElement("div");
        tile.className="tile";

        let x=(pos%3)*-100;
        let y=Math.floor(pos/3)*-100;

        tile.style.backgroundPosition = `${x}% ${y}%`;
        tile.dataset.correct=pos;

        tile.onclick=()=>selectTile(tile);

        puzzle.appendChild(tile);
    });
}

function selectTile(tile){
    if(!selected){
        selected=tile;
        tile.style.outline="2px solid white";
    }else{
        let temp=tile.style.backgroundPosition;
        tile.style.backgroundPosition=selected.style.backgroundPosition;
        selected.style.backgroundPosition=temp;

        selected.style.outline="";
        selected=null;

        checkPuzzle();
    }
}

function checkPuzzle(){
    const tiles=document.querySelectorAll(".tile");
    let ok=true;

    tiles.forEach((t,i)=>{
        if(t.dataset.correct!=i) ok=false;
    });

    if(ok){
        document.getElementById("puzzleMsg").style.display="block";
    }
}

/* effets */
function lancerEffets(){
    setInterval(()=>{
        const h=document.createElement("div");
        h.className="heart";
        h.innerHTML="❤️";
        h.style.left=Math.random()*100+"vw";
        h.style.fontSize=(15+Math.random()*20)+"px";
        h.style.animationDuration=(4+Math.random()*3)+"s";
        document.body.appendChild(h);
        setTimeout(()=>h.remove(),8000);
    },300);

    setInterval(()=>{
        const p=document.createElement("div");
        p.className="petal";
        p.innerHTML="🌹";
        p.style.left=Math.random()*100+"vw";
        p.style.fontSize=(12+Math.random()*18)+"px";
        p.style.animationDuration=(5+Math.random()*4)+"s";
        document.body.appendChild(p);
        setTimeout(()=>p.remove(),9000);
    },250);
}

</script>

</body>
</html>
